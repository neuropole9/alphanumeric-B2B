services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alphanumeric}
      POSTGRES_USER: ${POSTGRES_USER:-alphanumeric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alphanumeric} -d ${POSTGRES_DB:-alphanumeric}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_NAME: ${APP_NAME:-AlphaNumeric B2B Platform}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alphanumeric}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alphanumeric}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      COMPANY_NAME: ${COMPANY_NAME:?Set COMPANY_NAME in .env}
      COMPANY_GSTIN: ${COMPANY_GSTIN:?Set COMPANY_GSTIN in .env}
      COMPANY_PAN: ${COMPANY_PAN:?Set COMPANY_PAN in .env}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:?Set COMPANY_ADDRESS in .env}
      COMPANY_PHONE: ${COMPANY_PHONE:?Set COMPANY_PHONE in .env}
      COMPANY_EMAIL: ${COMPANY_EMAIL:?Set COMPANY_EMAIL in .env}
      COMPANY_LOGO_PATH: ${COMPANY_LOGO_PATH:-}
      BRAND_PRIMARY: "${BRAND_PRIMARY:-#0B2E59}"
      BRAND_ACCENT: "${BRAND_ACCENT:-#1268DC}"
      BANK_NAME: ${BANK_NAME:?Set BANK_NAME in .env}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:?Set BANK_ACCOUNT_NAME in .env}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:?Set BANK_ACCOUNT_NUMBER in .env}
      BANK_IFSC: ${BANK_IFSC:?Set BANK_IFSC in .env}
      MEDIA_ROOT: /app/media
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-8388608}
      MEDIA_MAX_FILES_PER_PRODUCT: ${MEDIA_MAX_FILES_PER_PRODUCT:-12}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_ROOT_FOLDER_NAME: ${GOOGLE_DRIVE_ROOT_FOLDER_NAME:-AlphaNumeric Quotation}
      GOOGLE_DRIVE_QUOTA_WARNING_PERCENT: ${GOOGLE_DRIVE_QUOTA_WARNING_PERCENT:-90}
      EXTERNAL_IMPORT_ALLOWED_DOMAINS: ${EXTERNAL_IMPORT_ALLOWED_DOMAINS:-arcotindia.com,www.arcotindia.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      INVITATION_EXPIRY_HOURS: ${INVITATION_EXPIRY_HOURS:-24}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FILE_DIR: /app/media/email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@alphanumeric.local}
    volumes:
      - media_data:/app/media
    ports:
      - "8080:8080"
volumes:
  postgres_data:
  media_data:
