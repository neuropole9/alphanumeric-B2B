services:
  - type: web
    name: alphanumeric-b2b
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alphanumeric-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_GSTIN
        sync: false
      - key: COMPANY_PAN
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_IFSC
        sync: false
      - key: MEDIA_ROOT
        value: /app/media
      - key: MEDIA_STORAGE_PROVIDER
        value: google_drive
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_NAME
        value: AlphaNumeric Quotation
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_BACKEND
        value: console
      - key: EMAIL_FILE_DIR
        value: /app/media/email
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: alphanumeric-media
      mountPath: /app/media
      sizeGB: 1
databases:
  - name: alphanumeric-db
    databaseName: alphanumeric
    user: alphanumeric
    plan: basic-256mb
